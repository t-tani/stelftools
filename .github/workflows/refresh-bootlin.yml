name: refresh-bootlin-signatures

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Earliest Bootlin release (YYYY.MM[-N]); empty means "every release in the index"'
        required: false
        default: ''
      until:
        description: 'Latest Bootlin release (YYYY.MM[-N]); empty means "newest in the index"'
        required: false
        default: ''
      arch:
        description: 'Comma-separated arch allowlist; empty means "every arch"'
        required: false
        default: ''
      libc:
        description: 'Comma-separated libc allowlist'
        required: false
        default: 'glibc,musl,uclibc'
      max_jobs:
        description: 'Cap on matrix size to keep CI minutes bounded'
        required: false
        default: '12'
  schedule:
    # Monthly: 04:17 UTC on the first day of the month.
    - cron: '17 4 1 * *'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
      count: ${{ steps.diff.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Discover Bootlin releases
        id: discover
        run: |
          set -eux
          python tools/ci/bootlin_index.py \
            --out index.json \
            --stability stable \
            ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }} \
            ${{ github.event.inputs.until && format('--until {0}', github.event.inputs.until) || '' }} \
            ${{ github.event.inputs.arch  && format('--arch {0}',  github.event.inputs.arch)  || '' }} \
            --libc "${LIBC}"
        env:
          LIBC: ${{ github.event.inputs.libc || 'glibc,musl,uclibc' }}

      - name: Diff against on-disk signatures
        id: diff
        run: |
          set -eux
          python tools/ci/bootlin_diff.py index.json \
            --signatures-dir signatures \
            --out missing.json
          # Truncate to max_jobs to keep wall time bounded; the remainder
          # is picked up on the next dispatch / monthly cron.
          python - <<'PY' "${MAX_JOBS}"
          import json, sys
          cap = int(sys.argv[1])
          rows = json.load(open('missing.json'))
          rows = rows[:cap]
          with open('matrix.json', 'w') as f:
              json.dump(rows, f)
          print(f"matrix size: {len(rows)}")
          PY
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json; print(len(json.load(open("matrix.json"))))')" >> "$GITHUB_OUTPUT"
        env:
          MAX_JOBS: ${{ github.event.inputs.max_jobs || '12' }}

  build:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # stelftools.info_create takes ~50 minutes on a fast local box for the
    # glibc/aarch64 toolchain; GitHub-hosted runners are slower. 90 minutes
    # leaves headroom without burning the 6-hour job ceiling.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install stelftools
        run: |
          python -m pip install --upgrade pip
          # Editable install pulls dependencies from pyproject.toml and
          # exposes `python -m stelftools.info_create` (driven by
          # build_bootlin_signature.sh below) plus the console-script
          # entry points. The qiling extra is left out — the CI runner
          # never executes a qiling-backed plugin.
          python -m pip install -e .

      - name: Build signature
        run: |
          bash tools/ci/build_bootlin_signature.sh \
            --release "${{ matrix.release }}" \
            --libc    "${{ matrix.libc }}" \
            --arch    "${{ matrix.arch }}" \
            --ext     "${{ matrix.ext }}" \
            --stability "${{ matrix.stability }}" \
            --python python

      - name: Bundle signature into a tarball
        # actions/upload-artifact strips the longest common path prefix
        # across all `path:` entries. With four siblings under
        # signatures/<family>/<arch>/ the LCP would be that directory
        # and the archive would lose the family/arch path. Tar from the
        # signatures/ root so the artifact preserves the layout
        # verbatim and the publish job can extract straight into place.
        run: |
          set -eux
          mkdir -p /tmp/sig-out
          tar -C signatures -cf "/tmp/sig-out/${{ matrix.signature_name }}.tar" \
            "${{ matrix.family }}/${{ matrix.arch }}/${{ matrix.signature_name }}.yara" \
            "${{ matrix.family }}/${{ matrix.arch }}/${{ matrix.signature_name }}.json" \
            "${{ matrix.family }}/${{ matrix.arch }}/${{ matrix.signature_name }}.dlist" \
            "${{ matrix.family }}/${{ matrix.arch }}/${{ matrix.signature_name }}.alist"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sig-${{ matrix.signature_name }}
          if-no-files-found: error
          retention-days: 7
          path: /tmp/sig-out/${{ matrix.signature_name }}.tar

  publish:
    needs: [discover, build]
    # Run whenever discover produced a non-empty matrix, even if some
    # build matrix entries failed. With `fail-fast: false` on the build
    # job the surviving entries still upload their artifacts; this
    # publish job picks them up so a single transient failure (Bootlin
    # 5xx, a flaky tarball, etc.) does not waste an entire dispatch.
    # `discover.result == 'success'` keeps us from running on a broken
    # index step; `always()` is required to override the implicit
    # "skip on needs failure" behavior that `success()` would impose.
    if: ${{ always() && needs.discover.result == 'success' && needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    # Fetch + extract + re-tar of the full signature catalog at
    # zstd-15 dominates the wall time. 120 minutes leaves room for the
    # large Bootlin arches without hitting the 6-hour job ceiling.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install stelftools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Stage signatures + publish output on /mnt
        # ubuntu-latest mounts /mnt as a roomy temp volume (~60 GB)
        # while the / partition only has ~14 GB free after the runner
        # image. The full signature catalog unpacks to ~12 GB, so we
        # route the fetch destination and the publish staging dir to
        # /mnt to avoid filling the root disk.
        run: |
          sudo mkdir -p /mnt/sigs /mnt/publish-stage
          sudo chown "$USER":"$USER" /mnt/sigs /mnt/publish-stage
          echo "STELFTOOLS_SIGNATURES_DIR=/mnt/sigs" >> "$GITHUB_ENV"
          echo "PUBLISH_STAGING=/mnt/publish-stage" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        # Each artifact carries a single tarball containing
        # <family>/<arch>/<signature_name>.{yara,json,dlist,alist}.
        uses: actions/download-artifact@v8
        with:
          pattern: sig-*
          merge-multiple: true
          path: /tmp/sig-archives

      - name: Fetch existing signature catalog
        # Pre-load every (family, arch) that's already in the published
        # manifest so the next publish carries the full catalog, not
        # just this run's deltas. Without this step the new manifest
        # would replace the previous one with only the newly-built
        # entries and orphan every URL pip-install users currently
        # depend on.
        run: |
          stelftools-fetch-signatures

      - name: Layer new build artifacts on top
        run: |
          set -eux
          for tar in /tmp/sig-archives/*.tar; do
            tar -C "$STELFTOOLS_SIGNATURES_DIR" -xf "$tar"
          done

      - name: Inspect new files
        run: |
          find "$STELFTOOLS_SIGNATURES_DIR" \
            -path '*/bootlin-*/*/bl-*.yara' -newer /etc/hostname | head -20

      - name: Publish draft release + refresh manifest
        env:
          # gh release create reads GH_TOKEN (or GITHUB_TOKEN); the
          # workflow's contents: write permission lets it create the
          # release on the same repo.
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="signatures-$(date -u +%Y-%m-%d)"
          python tools/ci/publish_signatures_release.py \
            --draft \
            --zstd-level 15 \
            --staging-dir "$PUBLISH_STAGING" \
            --tag "$tag" \
            --target-branch main

      - name: Commit manifest to ci-refresh branch
        run: |
          set -eux
          branch="ci/manifest-refresh-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add stelftools/signatures_manifest.json
          if git diff --cached --quiet; then
            echo "no manifest change to commit"
            exit 0
          fi
          tag="signatures-$(date -u +%Y-%m-%d)"
          subject="[ci/manifest] point at $tag draft release"
          {
            echo "$subject"
            echo
            echo "Generated by .github/workflows/refresh-bootlin.yml run $GITHUB_RUN_ID."
            echo
            echo "Promote the draft release at"
            echo "  https://github.com/$GITHUB_REPOSITORY/releases"
            echo "before merging this branch — otherwise pip-install users"
            echo "will 404 against the manifest's URLs until the release"
            echo "is published."
          } > .commit-msg
          git commit -F .commit-msg
          rm .commit-msg
          git push origin "$branch"
          echo "Pushed $branch."
